name: Build iOS App (Capacitor)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync ios

      - name: Build iOS Workspace (Simulator / Unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -destination 'generic/platform=iOS' \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package App as Payload / Zip
        run: |
          mkdir -p build-output/Payload
          cp -r $(find ~/Library/Developer/Xcode/DerivedData -name "App.app" | head -n 1) build-output/Payload/
          cd build-output
          zip -r PersonalLifeHub.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalLifeHub-iOS
          path: build-output/PersonalLifeHub.ipa
