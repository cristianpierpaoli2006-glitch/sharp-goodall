name: Build iOS App (Capacitor)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Verify Node version
        run: |
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync ios

      - name: Build iOS Project (Unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -destination 'generic/platform=iOS' \
                     -configuration Release \
                     -derivedDataPath build-output/DerivedData \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_IDENTITY="" \
                     build

      - name: Package App as Payload / IPA
        run: |
          mkdir -p build-output/Payload
          APP_PATH=$(find build-output/DerivedData -name "App.app" -type d | head -n 1)
          echo "Found built app at: $APP_PATH"
          cp -r "$APP_PATH" build-output/Payload/
          cd build-output
          zip -r PersonalLifeHub.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalLifeHub-iOS
          path: build-output/PersonalLifeHub.ipa
